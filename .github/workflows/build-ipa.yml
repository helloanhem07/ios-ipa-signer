name: Build and Package iOS IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Xcode Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode & Swift Environment
        run: |
          echo "==> Active Xcode Version:"
          xcodebuild -version
          swift --version

      - name: Check Signing Assets
        id: check-secrets
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "HAVE_SECRETS=true" >> "$GITHUB_ENV"
            echo "==> Complete code signing assets detected."
          else
            echo "HAVE_SECRETS=false" >> "$GITHUB_ENV"
            echo "==> Code signing secrets not provided. Will build unsigned IPA (can be signed directly inside the app or with TrollStore/AltStore/Sideloadly)."
          fi

      - name: Provision Ephemeral Keychain & Import Certificate (If Secrets Available)
        if: env.HAVE_SECRETS == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "==> Setting up headless ephemeral build keychain..."
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24 | tr -d '\r\n')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile (If Secrets Available)
        if: env.HAVE_SECRETS == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw - 2>/dev/null || true)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_PATH" "$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"

      - name: Build and Package iOS Application (.app)
        run: |
          CONFIG="${{ github.event.inputs.build_configuration || 'Release' }}"
          PROJECT_PATH="iOSApp/iOSApp.xcodeproj"
          SCHEME="iOSApp"
          BUILD_DIR="$RUNNER_TEMP/BuildOutput"

          echo "==> Building $SCHEME targeting generic/platform=iOS ($CONFIG)..."
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

          APP_PATH=$(find "$BUILD_DIR/Build/Products" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error ::Built .app bundle not found in Products."
            exit 1
          fi

          echo "==> Found built bundle: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          mkdir -p output
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/output/iOSApp.ipa" Payload/
          cd "$GITHUB_WORKSPACE"

          echo "==> Successfully created IPA package:"
          ls -lh output/iOSApp.ipa

      - name: Upload iOSApp IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSApp-IPA
          path: output/iOSApp.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-release"
          gh release delete "$TAG_NAME" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG_NAME" output/iOSApp.ipa \
            --title "iOSApp IPA - Sẵn sàng cài đặt" \
            --notes "Bản build IPA được biên dịch tự động qua Xcode trên GitHub Actions runner macOS. Bạn có thể cài đặt trực tiếp qua TrollStore, AltStore, Sideloadly hoặc import vào app để tự ký on-device." \
            --latest
